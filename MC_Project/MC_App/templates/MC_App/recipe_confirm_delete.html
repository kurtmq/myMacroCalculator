<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Recipe</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'MC_App/css/style.css' %}">
</head>
<body>
<div class="container" style="text-align:center; max-width:500px; margin:100px auto;">
    <h2>Delete Recipe</h2>
    <p>Are you sure you want to delete <strong>{{ recipe.name }}</strong>?</p>
    <p>This action cannot be undone.</p>

    <form method="post" style="margin-top:20px;">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'recipe_edit' recipe.id %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
