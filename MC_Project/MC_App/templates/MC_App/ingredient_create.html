<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Ingredient - Meal Cost Calculator</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'MC_App/css/style.css' %}">
</head>
<body>
    <div class="container">
        <div class="header-links">
            <h1>Add New Ingredient</h1>
            <a href="{% url 'ingredient_list' %}" class="btn btn-secondary">
                ← Back to Ingredients
            </a>
        </div>

        <div class="card">
            <form method="POST">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="name">Ingredient Name</label>
                    <input type="text" id="name" name="name" required placeholder="e.g. Chicken Breast">
                </div>

                <div class="form-group">
                    <label>Serving Size</label>
                    <div class="form-row">
                        <div class="form-group">
                            <input type="number" name="serving_size_value" step="0.01" required 
                                   placeholder="e.g. 100" min="0">
                            <small class="text-muted">Amount</small>
                        </div>
                        <div class="form-group">
                            <select name="serving_size_unit" required>
                                <option value="">Select Unit</option>
                                {% for value, label in units %}
                                <option value="{{ value }}">{{ label }}</option>
                                {% endfor %}
                            </select>
                            <small class="text-muted">Unit</small>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="servings_per_container">Servings per Container</label>
                    <input type="number" id="servings_per_container" name="servings_per_container" 
                           step="0.01" required placeholder="e.g. 10" min="0">
                </div>

                <div class="form-group">
                    <label for="price">Price of Container (₱)</label>
                    <input type="number" id="price" name="price" step="0.01" required 
                           placeholder="e.g. 250.00" min="0">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="calories">Calories (per serving)</label>
                        <input type="number" id="calories" name="calories" step="0.01" required 
                               placeholder="e.g. 165" min="0">
                    </div>
                    <div class="form-group">
                        <label for="protein">Protein (g per serving)</label>
                        <input type="number" id="protein" name="protein" step="0.01" required 
                               placeholder="e.g. 31" min="0">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="carbs">Carbs (g per serving)</label>
                        <input type="number" id="carbs" name="carbs" step="0.01" required 
                               placeholder="e.g. 0" min="0">
                    </div>
                    <div class="form-group">
                        <label for="fat">Fat (g per serving)</label>
                        <input type="number" id="fat" name="fat" step="0.01" required 
                               placeholder="e.g. 3.6" min="0">
                    </div>
                </div>

                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" name="notes" rows="3" 
                              placeholder="Optional: where to buy, tips, storage instructions, etc."></textarea>
                </div>

                <div class="flex-between mt-8">
                    <a href="{% url 'ingredient_list' %}" class="btn btn-secondary">
                        Cancel
                    </a>
                    <button type="submit" class="btn">
                        Save Ingredient
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
